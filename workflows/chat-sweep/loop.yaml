name: chat-sweep
version: "1.2.0"
description: >
  Reviews the monitored WhatsApp chats for pending items — unanswered questions,
  promised actions, approaching deadlines — and acts on the operator's behalf or
  flags decisions for approval.
schedule: "0 0 */4 * * *"
memory_mb: 48

# It never sends a message itself: the harness does, using wacli. What this loop
# needs is the harness, and the three ways of telling the operator something.
host:
  - log
  - config
  - hosttool
  - harness
  - notify
  - propose
  - remind
  - tool
  - remember
  - short_all
  - short_set
  - chat_summary_get
  - chat_summary_save

tools:
  - whatsapp.monitored

capabilities:
  - memory:nexus
  - memory:nexus:write
  - tool:harness
  - tool:app.push
  - tool:propose
  - tool:reminder.add
