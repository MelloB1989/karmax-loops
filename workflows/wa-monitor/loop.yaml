name: wa-monitor
version: "1.3.0"
description: >
  The proactive WhatsApp proxy. Reacts to incoming messages in monitored chats,
  answers what it confidently can in the operator's voice, and escalates
  anything that is a decision.
events:
  - comms.message
memory_mb: 96

host:
  - log
  - config
  - hosttool
  - trigger
  - ask
  - gateway
  - harness
  - summarize
  - notify
  - propose
  - remind
  - tool
  - short_set
  - short_get
  - short_all
  - operator_chats
  - recall
  - remember

# The one loop that can send as the operator, and the reason a capability list
# is worth reading before installing anything.
tools:
  - whatsapp_send_message
  - whatsapp_search_messages
  - whatsapp.monitored

capabilities:
  - tool:agent.ask
  - tool:gateway
  - tool:harness
  - tool:summarize
  - tool:app.push
  - tool:propose
  - tool:reminder.add
  - memory:nexus
  - memory:nexus:write
  - memory:nexus
  - memory:nexus:write:write
